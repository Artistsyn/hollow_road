[package]
name = "hollow_road"
version = "0.1.0"
edition = "2021"
description = "A soulslike pilgrimage down one living road: PathForge draws the road live, Quartz runs the fight on it"

[lib]
name = "main"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
quartz = { path = "../quartz" }
ramp = { package = "ramp2", path = "../ramp" }
quartz_path_forge = { path = "../quartz_path_forge" }
image = { version = "0.25", default-features = false, features = ["png"] }
# Save profiles (`profile`): each pilgrimage kept as JSON in the player's data folder.
serde_json = "1"

# On Android the art, scenes and music travel inside the library (`assets::unpack` writes them to
# the app's own folder on the first launch, since PathForge reads its scenes by path); `log` puts
# the once-a-second frame report in logcat.
[target.'cfg(target_os = "android")'.dependencies]
include_dir = "0.7.4"
log = "0.4"

[package.metadata.android]
package = "com.synful.hollowroad"
build_targets = ["aarch64-linux-android"]
# The launcher icon (from tools/package/HollowRoad.icns, the Mac app's).
resources = "android/res"

[package.metadata.android.application]
label = "Hollow Road"
icon = "@mipmap/ic_launcher"
theme = "@android:style/Theme.NoTitleBar.Fullscreen"

# The canvas is CanvasMode::Landscape.
[package.metadata.android.application.activity]
orientation = "landscape"

# The SDK's standard debug keystore (password "android"), for test builds only: Google Play
# refuses anything signed with it. `build_android.sh` copies it in.
[package.metadata.android.signing.release]
path = "debug.keystore"
keystore_password = "android"

[package.metadata.android.sdk]
min_sdk_version = 33
target_sdk_version = 33

# PathForge draws on the GPU, but its CPU side (and the CPU fallback) is slow unoptimised.
[profile.dev.package.path_forge]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3

[dev-dependencies]
pollster = "0.4"
# The engine's own audio library: a test decodes every sound the game embeds.
rodio = "0.21.1"
